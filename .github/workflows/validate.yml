name: Validate Odoo production controls

on:
  pull_request:
  push:
    branches:
      - main
      - main-production
      - "agent/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev,aws]"
      - name: Compile Python
        run: python -m compileall -q scripts southern_* l10n_us_hr_payroll_ms_status
      - name: Run standalone regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Lint automation runtime and standalone tests
        run: ruff check scripts tests --select E4,E7,E9,F,I
      - name: Parse Odoo XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          paths = []
          for pattern in ("southern_*", "l10n_us_hr_payroll_ms_status"):
              for root in Path(".").glob(pattern):
                  paths.extend(root.rglob("*.xml"))
          for path in paths:
              ET.parse(path)
          print(f"Parsed {len(paths)} XML files")
          PY
      - name: Verify production automation entrypoint
        run: python scripts/odoo_record_product_automation_run.py --help
      - name: Reject common committed secret formats
        shell: bash
        run: |
          if git grep -nE '(sk-proj-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- \
              ':!*.example' ':!*.template.json'; then
            echo "Potential credential material detected."
            exit 1
          fi
